[versions]
agp = "8.5.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
# Compose compiler is coupled to the Kotlin version (Kotlin 1.9.24 -> 1.5.14).
# When bumping Kotlin, bump this to the matching release:
# https://developer.android.com/jetpack/androidx/releases/compose-kotlin#compose_compiler_compatible_with_kotlin
composeCompiler = "1.5.14"
composeBom = "2024.05.00"
coreKtx = "1.13.1"
# Android 12+ SplashScreen API, backported to API 23 (the app's minSdk).
# Used for the launcher's 200 ms brand flash (HANDOFF §"Screens: splash").
coreSplashscreen = "1.0.1"
activityCompose = "1.9.0"
# 2.7.0, NOT 2.8.x: lifecycle-runtime-compose 2.8's collectAsStateWithLifecycle
# reads androidx.lifecycle.compose.LocalLifecycleOwner, which only compose-ui
# 1.7+ provides. With composeBom 2024.05.00 (ui 1.6.x) that CompositionLocal has
# no value and every screen dies on first composition
# ("CompositionLocal LocalLifecycleOwner not present" — QA finding F-01).
# 2.7 reads compose-ui's platform LocalLifecycleOwner instead, which this
# generation does provide. Nothing in the tree needs a 2.8-only API.
# NB: F-01 was also "fixed" on feat/browse-spec/feat/player-handoff-r2 by a
# CompositionLocalProvider shim inside HappyTvTheme — that shim only covers
# activities that wrap in the theme (login, dashboard, player); the browse
# activities don't, so Live TV / Movies / Shows would still crash. This pin
# fixes all call sites, and the shim hunk cannot compile against 2.7
# (its lifecycle-2.8 LocalLifecycleOwner symbol is gone) — drop it on merge.
lifecycle = "2.7.0"
# Compose for TV (Material3 TV) — Surface, Card, Button, Text + the TV focus ring
# plumbing that the dashboard, status pill, header buttons and second-row cards
# all depend on. 1.0.0 stable is built against Compose 1.6.8, which the BOM
# above (2024.05.00 -> ui 1.6.7) satisfies via normal conflict resolution.
tv = "1.0.0"
# Material Icons Extended — the dashboard tile, status pill and second-row card
# all draw from Material Symbols (LiveTv, Movie, Tv, Search, Refresh, Schedule,
# Info, Tune, ViewTimeline, SmartDisplay, ErrorOutline, Check).
materialIconsExtended = "1.6.7"
media3 = "1.3.1"
room = "2.6.1"
okhttp = "4.12.0"
# Retrofit 2.11 ships the official kotlinx.serialization converter as
# com.squareup.retrofit2:converter-kotlinx-serialization (same version line).
retrofit = "2.11.0"
kotlinxSerialization = "1.6.3"
coroutines = "1.8.1"
datastore = "1.1.1"
# EncryptedSharedPreferences / MasterKey. 1.1.0 is the first stable release of
# the 1.1 line (aar-metadata minCompileSdk=34 == our compileSdk, minSdk 21 < 23).
securityCrypto = "1.1.0"
desugar = "2.0.4"
# Coil — Compose image loading for poster art (Movies / Shows rails). Kotlin
# 1.9.x / Compose 1.6.x-compatible 2.x line; no new Kotlin required. Loading
# HTTPS (TMDB `stream_icon` URLs) is not gated by cleartext policy, so the
# default ImageLoader is fine (no `networkSecurityConfig` change).
coil = "2.6.0"
# WorkManager — RefreshGuideWorker (periodic guide refresh, data/guide).
work = "2.9.1"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.12.2"
# Compose Navigation — the browse lanes' NavHost (live_tv / categories/{type} /
# streams/{type}/{categoryId} / details/{type}/{streamId}).
navigationCompose = "2.7.7"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# ProcessLifecycleOwner — foreground/background observer registered in HappyTvApp.onCreate.
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
# viewModel() Compose helper — DashboardViewModel and the future
# screen-specific ViewModels (LiveTvViewModel, GuideViewModel, …) bind through it.
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# collectAsStateWithLifecycle — the Dashboard collects the ViewModel's StateFlow
# through this so collection pauses when the activity is stopped (TV goes to
# screen-saver) and resumes cleanly on return.
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
# Compose UI tests (Robolectric): the sign-in card's Gboard Next/Done hand-off.
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# Host activity entry for createComposeRule(); must ride the debug variant so
# it lands in the merged manifest Robolectric reads for unit tests.
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Compose for TV (Material3 TV) — Carousel, Card, Surface, Button, IconButton
# and the focused-scale / glow / ring modifiers every TV surface depends on.
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tv" }
# Material Icons Extended (Material Symbols). The dashboard tile icons,
# status pill icons and second-row card icons all draw from this set.
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }

# Compose Navigation — the browse NavHost's route graph.
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Media3 (ExoPlayer + UI + session for TV playback / MediaSession integration)
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
# HLS — .m3u8 is the live-stream default (protocol §3.4); the hls media-source
# module rides alongside media3-exoplayer, not inside it.
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
# OkHttp-backed data source (#21): lets a network interceptor veto each redirect hop.
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Coil — Compose image loading for poster art on the Movies / Shows rails.
# `coil-compose` brings in `AsyncImage` + `ImageRequest`; HTTPS (TMDB) loads
# work without a `networkSecurityConfig` override (cleartext policy applies
# only to http:// — panel stream_icon URLs are https://image.tmdb.org).
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Room (KSP compiler wired in app/build.gradle.kts)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Networking + JSON
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Retrofit + kotlinx.serialization converter — XtreamApi is @Serializable-DTO based.
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

# WorkManager — RefreshGuideWorker runs the periodic guide refresh.
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Prefs
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# EncryptedSharedPreferences (SecuredCredentialsStore) — plaintext prefs are
# banned for credentials, see security/SecuredCredentialsStore.kt.
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Core library desugaring (minSdk 23 + java.time / java.util APIs)
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
# XmlPullParser implementation for JVM unit tests (the Android runtime ships
# kxml2 inside the platform; the plain-JUnit parser tests need it on the classpath).
kxml2 = { group = "net.sf.kxml", name = "kxml2", version = "2.3.0" }
# WorkManager test harness (WorkManagerTestInitHelper) for scheduler tests.
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
# Canned-JSON tests for XtreamApi/DTOs (MockWebServer, same OkHttp line).
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# @Serializable DTOs in data/network (data layer decision: one JSON mapper).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
